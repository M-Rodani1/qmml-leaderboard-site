name: Sync Kaggle leaderboard
on:
  schedule:
    - cron: "17 * * * *"   # hourly
  workflow_dispatch:
  push:
    paths: [members.json, competitions.json]
permissions:
  contents: write
concurrency: sync
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python scripts/sync.py
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      - name: Commit changes
        run: |
          git config user.name "leaderboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/leaderboard.json
          git diff --staged --quiet || (git commit -m "Update leaderboard" && git push)
